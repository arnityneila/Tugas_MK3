<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <link rel="stylesheet" href="registrasi.css">
</head>
<body>

<div class="container">
    <h2>Registrasi</h2>

    <form>
        <label>Nama Lengkap:</label>
        <input type="text" placeholder="Masukkan Nama Lengkap" required>

        <label>Username:</label>
        <input type="text" placeholder="Masukkan Username" required>

        <label>Email:</label>
        <input type="email" placeholder="Masukkan Email" required>

        <label>Password:</label>
        <input type="password" placeholder="Masukkan Password" required>

        <label>Konfirmasi Password:</label>
        <input type="password" placeholder="Konfirmasi Password" required>

        <label>Tanggal Lahir:</label>
        <input type="date">

        <label>Jenis Kelamin:</label>
        <div class="radio-group">
            <input type="radio" name="jk"> Laki-laki
            <input type="radio" name="jk"> Perempuan
        </div>

        <label>Kelas:</label>
        <select required>
            <option value="" disabled selected>-- Pilih Kelas --</option>
            <option>XI PPLG 1</option>
            <option>XI PPLG 2</option>
            <option>XI PPLG 3</option>
            <option>XI PPLG 4</option>
        </select>

        <label>Alamat:</label>
        <textarea placeholder="Masukkan Alamat"></textarea>

        <div class="checkbox">
            <input type="checkbox" required>
            Saya menyetujui syarat dan ketentuan yang berlaku
        </div>

        <button type="submit">Daftar</button>

        <p>Sudah memiliki akun? <a href="#">Login di sini</a></p>
    </form>
</div>

</body>
</html>
